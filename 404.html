<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Not Found | MM Freediving</title>
<meta name="robots" content="noindex" />
<script>
  // GitHub Pages has no server-side pretty-URL mapping, so route extensionless
  // paths (e.g. /booking) to their .html file (e.g. /booking.html).
  (function () {
    var p = location.pathname;
    if (!/\.[a-z0-9]+$/i.test(p) && p !== '/' && !p.endsWith('/')) {
      location.replace(p + '.html' + location.search + location.hash);
    }
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;
       justify-content:center;text-align:center;background:#faf7f2;color:#1c2b32;
       font-family:'DM Sans',system-ui,sans-serif;padding:2rem}
  h1{font-family:Georgia,serif;font-weight:300;font-size:2.4rem;margin:0 0 .5rem}
  p{color:#6e6258;margin:0 0 1.8rem}
  a{display:inline-block;padding:.85rem 2.2rem;border:1.5px solid #e87c3e;color:#c45e28;
    text-decoration:none;letter-spacing:.2em;text-transform:uppercase;font-size:.7rem}
</style>
</head>
<body>
  <h1>Page not found</h1>
  <p>That page drifted off with the current.</p>
  <a href="/">Back to Home</a>
</body>
</html>
